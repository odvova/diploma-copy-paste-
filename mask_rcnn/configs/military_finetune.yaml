_BASE_: ../../detectron2/configs/COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml

MODEL:
  WEIGHTS: "outputs/isaid/model_final.pth"
  ROI_HEADS:
    NUM_CLASSES: 5

DATASETS:
  TRAIN: ("military_train",)
  TEST: ("military_val",)

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.002
  MAX_ITER: 30000
  STEPS: (20000, 27000)
  CHECKPOINT_PERIOD: 5000
  AMP:
    ENABLED: True

TEST:
  EVAL_PERIOD: 5000

INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)

OUTPUT_DIR: "outputs/military"
